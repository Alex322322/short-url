services:
  pg:
    image: postgres:18.0
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pg_volume:/var/lib/postgresql

  app:
    build: .
    restart: always
    ports:
      - 8084:8084
    environment:
      - HTTP_SERVER_PASSWORD=${HTTP_SERVER_PASSWORD}
    depends_on:
      - pg

volumes:
  pg_volume: {}