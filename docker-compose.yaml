services:
  pg:
    image: postgres:18.0
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pg_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - 8084:8084
    env_file:
      - .env
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_volume: {}